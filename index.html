<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Blockly Web Page Builder</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>
  <header class="app-header">
    <h1>Web Page Builder</h1>
    <button id="download-btn">Download as .html</button>
  </header>

  <div id="blockly-container">
    <div id="blockly-div"></div>
    <xml id="toolbox" style="display: none">
      <category name="Structure" colour="230">
        <block type="div"></block>
      </category>
      <category name="Content" colour="20">
        <block type="p"></block>
        <block type="h1"></block>
        <block type="h2"></block>
        <block type="h3"></block>
        <block type="img"></block>
        <block type="video"></block>
      </category>
      <category name="Text" colour="160">
        <block type="text"></block>
      </category>
      <category name="Style" colour="120">
        <block type="style"></block>
      </category>
      <category name="Logic" colour="65">
        <block type="script"></block>
        <block type="onclick"></block>
        <block type="controls_if"></block>
        <block type="controls_repeat_ext"></block>
        <block type="logic_compare"></block>
        <block type="math_number"></block>
        <block type="variables_set"></block>
        <block type="variables_get"></block>
        <block type="text_print"></block>
      </category>
    </xml>
  </div>

  <div id="preview-container">
    <h2>Live Preview</h2>
    <iframe id="preview-frame"></iframe>
  </div>

  <script src="js/custom_blocks.js"></script>
  <script src="js/html_generator.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
